name: Copilot Review Gate

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - review_requested
      - review_request_removed
  pull_request_review:
    types:
      - submitted
      - dismissed
      - edited
  pull_request_review_thread:
    types:
      - resolved
      - unresolved

permissions:
  contents: read
  pull-requests: read

jobs:
  copilot-review-gate:
    name: Copilot review gate
    runs-on: ubuntu-latest
    steps:
      - name: Validate Copilot review state
        uses: actions/github-script@v7
        with:
          script: |
            const copilotLogins = new Set([
              "copilot-pull-request-reviewer[bot]",
              "github-copilot[bot]"
            ]);

            const isCopilotLogin = (login) => {
              return copilotLogins.has((login ?? "").toLowerCase());
            };

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request?.number;

            if (!pull_number) {
              core.setFailed("Unable to determine pull request number from workflow event payload.");
              return;
            }

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            const requestedCopilot = (pr.data.requested_reviewers ?? []).some((reviewer) => {
              return isCopilotLogin(reviewer.login);
            });

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
              per_page: 100
            });

            const copilotReviews = reviews.filter((review) => {
              return isCopilotLogin(review.user?.login);
            });

            let hasCopilotThreadActivity = false;

            let unresolvedCopilotThreads = 0;
            let cursor = null;

            while (true) {
              const result = await github.graphql(
                `query($owner: String!, $repo: String!, $pullNumber: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $pullNumber) {
                      reviewThreads(first: 100, after: $cursor) {
                        nodes {
                          isResolved
                          comments(first: 100) {
                            nodes {
                              author {
                                login
                              }
                            }
                          }
                        }
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                      }
                    }
                  }
                }`,
                {
                  owner,
                  repo,
                  pullNumber: pull_number,
                  cursor
                }
              );

              const threads = result.repository.pullRequest.reviewThreads.nodes ?? [];

              const copilotThreads = threads.filter((thread) => {
                const hasCopilotComment = (thread.comments?.nodes ?? []).some((comment) => {
                  return isCopilotLogin(comment.author?.login);
                });

                if (!hasCopilotComment) {
                  return false;
                }

                if (!thread.isResolved) {
                  unresolvedCopilotThreads += 1;
                }

                return true;
              });

              hasCopilotThreadActivity = hasCopilotThreadActivity || copilotThreads.length > 0;

              const pageInfo = result.repository.pullRequest.reviewThreads.pageInfo;
              if (!pageInfo.hasNextPage) {
                break;
              }

              cursor = pageInfo.endCursor;
            }

            const hasCopilotActivity =
              requestedCopilot || copilotReviews.length > 0 || hasCopilotThreadActivity;

            if (!hasCopilotActivity) {
              core.info("No Copilot review requested; merge is allowed.");
              return;
            }

            if (requestedCopilot) {
              core.setFailed("Copilot review was requested and is still in progress.");
              return;
            }

            if (unresolvedCopilotThreads > 0) {
              core.setFailed(
                `Copilot left ${unresolvedCopilotThreads} unresolved review thread(s). Resolve all before merging.`
              );
              return;
            }

            core.info("Copilot review is complete and has no unresolved comments; merge is allowed.");
